name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Easyaller.slnx

      - name: Build
        run: dotnet build Easyaller.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Easyaller.slnx --configuration Release --no-build
